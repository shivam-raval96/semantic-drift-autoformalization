# @package _global_
# Manifold shakeout on an UNGATED model (Qwen2.5-1.5B-Instruct): exercises the
# full semantic-content geometry chain locally (MPS/CPU) with no HF token.
# Same analyses as the Llama runners; results are for pipeline validation and
# early geometry hypotheses, not headline claims.
defaults:
- /base
- /task: etp_implication
- /model: qwen25_15b_instruct
- /analysis/baseline
- /analysis/subspace
- /analysis/activation_manifold
- _self_

task:
  target_variable: implication
  n_train: 320
  n_test: 80
  # verdict geometry here; law-identity manifold lives in
  # etp_qwen15_lawmanifold.yaml (needs intrinsic_dim matched to the 3D
  # fingerprint embedding, which is a per-target setting)
  target_variables:
    - implication

subspace:
  layers: [7, 14, 21]   # explicit: locate is deferred (certified-resampling constraint)
  token_positions: [premise_last]

activation_manifold:
  layers: [7, 14, 21]
  token_positions: [premise_last]
